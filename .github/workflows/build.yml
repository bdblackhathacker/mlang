name: build
on: [push, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller && pyinstaller --noconfirm --onefile --name mlang mlang/cli.py
      - uses: actions/upload-artifact@v4
        with: { name: mlang-linux, path: dist/mlang }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # save the chat logo as mlang/package/assets/logo.png before pushing for the icon
      - run: pip install pyinstaller pillow
      - run: python mlang/package/assets/make_icon.py
      - run: pyinstaller --noconfirm --onefile --name mlang --icon mlang/package/assets/icon.ico mlang/cli.py
      - uses: actions/upload-artifact@v4
        with: { name: mlang-windows, path: dist/mlang.exe }
  image:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/bdblackhathacker/mlang:2.2.0,ghcr.io/bdblackhathacker/mlang:latest
